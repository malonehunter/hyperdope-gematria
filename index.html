<script>
// Deferred scripts (jQuery, calc.js, etc. above) don't finish running until
// just before DOMContentLoaded, so anything here that touches them - $,
// updateInterfaceColor - has to wait for that event too, or it runs first
// and finds them undefined.
document.addEventListener('DOMContentLoaded', function () {
	window.onpaint = function() {
		updateInterfaceColor(true); // update interface color (first run)
	}
	// .on("load"), not .load(fn) — the shorthand was removed in jQuery 3, where
	// .load() resolves to the AJAX method instead and calls .indexOf on its first
	// argument. Passing a function there threw "e.indexOf is not a function" and
	// the loading overlay never faded out.
	$(window).on("load", function(){
		$("#loader").delay(287).fadeOut("fast");
	});
});
</script>

<!-- Initialzie the calculator.  This needs to run before loading a database or theme.
     Wrapped in DOMContentLoaded, same reason as the <head> script above - the
     deferred scripts it depends on (initCalc, onAuthReady, ...) aren't defined
     until then. -->
<script>
document.addEventListener('DOMContentLoaded', function () {
	initCalc(true);

	// Signing in lands here, on the calculator. The welcome page is reached
	// from exactly one place - a member who has not been through it yet - so
	// there is no path that can send a returning member back to it.
	//
	// It used to be the other way round: every sign-in went to the welcome and
	// that page decided whether to bounce back, which meant any failure to
	// record "already seen" left a member stuck behind it on every visit.
	if (typeof onAuthReady === "function") {
		onAuthReady(function (user) {
			if (user === null || !authProfile) return;
			if (authProfile.setup_done !== false) return; // seen it, or column absent
			window.location.replace("profile.html");
		});
	}
});
</script>
